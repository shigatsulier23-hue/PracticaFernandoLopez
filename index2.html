<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="texto"> Hola </h1>
    <script>

let numero1, numero2, suma, resta, multiplicacion, division, residuo;

numero1 = Number(prompt("Ingrese el primer numero: "));
numero2 = Number(prompt("Ingrese el segundo numero: "));

suma = numero1 + numero2;
resta = numero1 - numero2;
multiplicacion = numero1 * numero2;
division = numero1 / numero2;
residuo = numero1 % numero2;

document.write("la suma de los números es: " + suma + "<br>" ); 
document.write("la resta de los números es: " + resta + "<br>" );
document.write("la multiplicación de los números es: " + multiplicacion + "<br>"  );
document.write("la division de los números es: " + division + "<br>"  );
document.write("el residuo de los números es: " + residuo + "<br>"  );
    </script>
</body>
</html>
